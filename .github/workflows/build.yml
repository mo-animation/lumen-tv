name: Build TV packages
on:
  push:
    branches: [main]
    paths: ['app/**', 'android/**', 'release/lumen.wgt', 'release/lumen.ipk', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build Android APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          KS_FILE="$RUNNER_TEMP/ks.p12" bash android/build.sh
      - name: Save APK to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/lumen.apk
          git diff --cached --quiet || { git commit -q -m "Build Android APK [skip ci]"; git push -q; }
      - name: Publish GitHub release (LG, Samsung, Android packages)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V="v$(cat release/version.txt)"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" release/lumen.apk release/lumen.wgt release/lumen.ipk --clobber
          else
            gh release create "$V" release/lumen.apk release/lumen.wgt release/lumen.ipk --title "Lumen $V" --notes "Install with the Lumen installer (release folder in the repo)." --latest
          fi
